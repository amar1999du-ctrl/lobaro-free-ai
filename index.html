<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOBARO & COSTIEU</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
.hidden{display:none!important}
.view{max-width:500px;margin:0 auto;min-height:100vh;background:#000;position:relative}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #111;position:sticky;top:0;background:#000;z-index:50}
.logo{font-weight:900;letter-spacing:3px;font-size:16px}
.cart-btn{width:42px;height:38px;background:#111;border:1px solid #222;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ai-banner{margin:12px 12px 0;background:#111;border:1px solid #1e1e1e;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.btn-gold{background:#D4AF37;color:#000;border:none;padding:8px 18px;border-radius:10px;font-weight:900;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 12px 120px}
.card{background:#121212;border:1px solid #1e1e1e;border-radius:18px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card .info{padding:10px 10px 12px}
.card .name{font-size:13px;font-weight:700;line-height:1.3;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .price{color:#D4AF37;font-weight:900;font-size:14px;margin-top:6px;text-align:left;direction:ltr}
.card .btn-w{width:100%;background:#fff;color:#000;border:none;padding:11px;border-radius:12px;font-weight:800;font-size:13px;margin-top:8px}
.card .btn-a{width:100%;background:transparent;color:#D4AF37;border:1px solid #2a2a2a;padding:8px;border-radius:12px;font-size:11px;margin-top:6px;font-weight:700}
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e1e1e;border:1px solid #333;border-radius:30px;display:flex;gap:4px;padding:6px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.bottom-nav button{background:transparent;border:none;color:#888;padding:10px 18px;border-radius:20px;font-weight:800;font-size:13px}
.bottom-nav button.active{background:#fff;color:#000}
</style>
</head>
<body>
<div id="vShop" class="view">
<div class="header"><div class="cart-btn" onclick="openCart()">🛒 <span id="cC" style="color:#D4AF37;font-size:11px;font-weight:900">0</span></div><div class="logo">LOBARO</div></div>
<div class="ai-banner"><div style="display:flex;gap:10px;align-items:center"><div style="font-size:22px">✨</div><div><b style="font-size:13px">جرب بالذكاء الاصطناعي مجانا</b><br><small style="color:#777;font-size:11px">ارفع صورتك وشوف اللبس عليك</small></div></div><button class="btn-gold" onclick="openAI()">جرب</button></div>
<div id="grid" class="grid"></div>
<div class="bottom-nav"><button onclick="openCart()">السلة</button><button onclick="openAI()">الذكاء ✨</button><button class="active">الرئيسية</button></div>
</div>
<script>
let men=[{id:1,name:'هودي LOBARO شتوي',price:42000,img:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500'},{id:2,name:'تيشيرت LOBARO Premium',price:28000,img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500'},{id:3,name:'قميص كاجوال',price:35000,img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500'}];
let cart=[];function render(){let gr=document.getElementById('grid');gr.innerHTML='';men.forEach(p=>{gr.innerHTML+=`<div class="card"><img src="${p.img}"><div class="info"><div class="name">${p.name}</div><div class="price">${p.price.toLocaleString()} د.ع</div><button class="btn-w" onclick="cart.push(men.find(x=>x.id==${p.id}));document.getElementById('cC').innerText=cart.length">اضف للسلة</button><button class="btn-a">جرب بالذكاء ✨ مجانا</button></div></div>`;});}render();
</script>
</body>
</html>
