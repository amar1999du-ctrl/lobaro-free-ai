<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOBARO & COSTIEU</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
.view{width:100vw;height:100vh;height:100dvh;background:#000;position:relative;overflow:hidden}
.hidden{display:none!important}
.login{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#1a1a1a,#0e0e0e);border:1px solid rgba(201,168,106,0.3);border-radius:20px;padding:24px}
.input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(201,168,106,0.4);border-radius:12px;padding:14px;color:#fff;margin-top:10px}
.btn-gold{width:100%;background:linear-gradient(180deg,#F1D6A8,#C9A86A);border:none;border-radius:12px;padding:15px;font-weight:900;margin-top:16px}
.entry{width:100vw;height:100vh;height:100dvh;position:relative;background:#000}
.entry img{width:100vw;height:100vh;height:100dvh;object-fit:cover;object-position:center top;display:block}
.btn{position:absolute;bottom:32px;width:42%;height:56px;background:linear-gradient(180deg,#E8D5B0,#D4B896);border:none;border-radius:30px;font-weight:900;font-size:12px;color:#2a1e10;box-shadow:0 8px 24px rgba(0,0,0,.7)}
.btn-men{right:5%}.btn-women{left:5%}
.head{position:absolute;top:0;left:0;right:0;height:68px;background:linear-gradient(180deg,#1a102a,#140e20);display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(201,168,106,0.15)}
.head h1{color:#C9A86A;letter-spacing:3px;font-size:17px}
</style>
</head>
<body>

<div id="vLogin" class="view">
<div class="login">
<div class="card">
<div style="text-align:center;color:#C9A86A;letter-spacing:3px">LOBARO & COSTIEU</div>
<div style="text-align:center;color:#fff;margin:20px 0;font-size:26px;font-weight:800">تسجيل الدخول</div>
<div style="color:#C9A86A;font-size:12px;text-align:right">رقم الهاتف العراقي</div>
<div style="display:flex;gap:8px;direction:ltr;background:rgba(255,255,255,0.07);border:1px solid rgba(201,168,106,0.4);border-radius:12px;padding:0 14px;height:54px;margin-top:10px;align-items:center">
<span style="color:#C9A86A;font-weight:900">🇮🇶 +964</span>
<input value="7708265111" style="flex:1;background:transparent;border:none;color:#fff;outline:none;direction:ltr">
</div>
<input class="input" type="password" placeholder="كلمة المرور">
<button class="btn-gold" onclick="document.getElementById('vLogin').classList.add('hidden');document.getElementById('vEntry').classList.remove('hidden')">دخول ✨</button>
</div>
</div>
</div>

<div id="vEntry" class="view hidden">
<div class="entry">
<img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=600" id="mainEntry" style="filter:brightness(0.4) sepia(1) hue-rotate(320deg) saturate(2) contrast(1.2)">
<div class="head"><h1>LOBARO & COSTIEU</h1></div>

<!-- COSTIEU يسار - بنية -->
<div style="position:absolute;top:72px;left:0;width:50%;height:calc(100% - 72px);background:linear-gradient(180deg,#5a1e2a,#4a1822);display:flex;flex-direction:column;align-items:center;padding-top:24px">
<div style="color:#D4B78A;font-size:26px;letter-spacing:2px;text-align:center">COSTIEU<br><span style="font-size:13px">كوستيو</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%">

<div style="color:#D4B78A;font-size:26px;letter-spacing:2px;text-align:center">LOBARO<br><span style="font-size:13px">لوبارو</span></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%">
<svg width="120" height="280" viewBox="0 0 120 280" fill="none" stroke="#E8C9A8" stroke-width="1" stroke-linecap="round">
<circle cx="60" cy="28" r="12" /><path d="M44 52 Q40 60,38 74 Q36 86,34 98 M78 52 Q82 60,84 74 Q86 86,88 98 M38 74 Q50 78,56 72 M66 72 Q78 78,84 74 M44 52 Q56 48,60 52 Q64 48,78 52 M56 72 Q54 90,52 110 Q50 130,48 150 Q46 170,44 190 Q42 210,40 230 Q38 244,40 254 Q42 264,52 266 Q58 266,56 258 M66 72 Q68 90,70 110 Q72 130,74 150 Q76 170,78 190 Q80 210,82 230 Q84 244,82 254 Q80 264,70 266 Q64 266,66 258 M52 110 Q62 114,70 110 M44 190 Q52 188,60 190 M68 190 Q76 188,84 190" />

</div>
</div>

<button class="btn btn-women" onclick="alert('COSTIEU')">Shop Women's</button>
<button class="btn btn-men" onclick="alert('LOBARO')">Shop Men's</button>
</div>
</div>

</body>
</html>
